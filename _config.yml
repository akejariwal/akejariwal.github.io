# Site settings
title: "Arun Kejariwal"
description: "AI Research & Systems"
author: "Arun Kejariwal"

# Site URL configuration
# (For akejariwal.github.io root repository)
url: "https://akejariwal.github.io"
baseurl: ""

# Clean post permalink format (e.g., https://akejariwal.github.io/2026-07-26-vrm.html)
permalink: /:year-:month-:day-:slug.html

# Header pages navigation (Only show Publications link at top right)
header_pages:
  - publications.md

# Build settings & Theme
theme: minima
markdown: kramdown

# KaTeX math rendering support
kramdown:
  math_engine: null

# Jekyll Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
