<header class="site-header" role="banner">
  <div class="wrapper custom-header">
    
    <!-- Left: Square Photo + Name & Title Stack -->
    <div class="header-profile">
      <a class="profile-link" href="{{ '/' | relative_url }}">
        <div class="profile-photo-wrapper">
          <img src="{{ '/assets/images/profile.jpg' | relative_url }}" 
               alt="Arun Kejariwal" 
               class="profile-photo"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="profile-avatar-fallback">AK</div>
        </div>
        <div class="profile-text">
          <span class="profile-name">Arun Kejariwal</span>
          <span class="profile-title">AI Research & Systems</span>
        </div>
      </a>
    </div>

    <!-- Right: Logo tile stacked above the Publications link -->
    <div class="header-right">
      <a class="header-logo-link" href="{{ '/' | relative_url }}" aria-label="Home">
        <div class="header-logo-wrapper">
          <img src="{{ '/assets/images/alpha-arrow-logo-white-8000.png' | relative_url }}"
               alt="Alpha arrow logo"
               class="header-logo">
        </div>
      </a>
      <nav class="site-nav">
        <div class="trigger">
          <a class="page-link" href="{{ '/publications/' | relative_url }}">Publications</a>
        </div>
      </nav>
    </div>

  </div>
</header>
